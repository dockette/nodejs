name: Docker

on:
  workflow_dispatch:

  push:
    branches: [master]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: v6
          - image: v7
          - image: v8
          - image: v9
          - image: v10
          - image: v11
          - image: v12
          - image: v13
          - image: v14
          - image: v15
          - image: v16
          - image: v17
          - image: v18
          - image: v19
          - image: v20
          - image: v21
          - image: v22
          - image: v23
          - image: v24
          - image: v25
          - image: v26

      fail-fast: false

    name: Docker (dockette/nodejs:${{ matrix.image }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read VERSION
        id: version
        run: |
          v="$(cat VERSION)"
          grep -Eqx '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' <<<"$v" || { echo "::error file=VERSION::expected YYYY.MM.DD or YYYY.MM.DD.N, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          tags: dockette/nodejs:${{ matrix.image }}
          platforms: linux/amd64,linux/arm64

      - name: Load docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          load: true
          tags: dockette/nodejs:${{ matrix.image }}

      - name: Test node version
        run: |
          var="$(docker run --rm dockette/nodejs:${{ matrix.image }} node -v)"
          if [[ $var =~ "${{ matrix.image }}" ]]; then
              echo "Node version matched ${var} =~ ${{ matrix.image }}"
          else
              echo "Invalid node version ${var} != ${{ matrix.image }}"
              exit 255
          fi

      - name: Push docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: true
          tags: |
            dockette/nodejs:${{ matrix.image }}
            dockette/nodejs:${{ matrix.image }}-${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64

  docs:
    name: "Docs"
    needs: docker
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/nodejs"

  release:
    name: "Release"
    needs: docker
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists"
            exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes
